# CloudSSH 桌面客户端打包配置（electron-builder）
# 打包：在仓库根目录运行 pnpm dist:win（会先构建内置 UI 与桌面端）
appId: com.xmzo.cloudssh
productName: CloudSSH
copyright: Copyright © 2026 XMZO

directories:
  output: release
  buildResources: resources

# 主进程/preload/管理页都已由 esbuild 打成单文件，运行时不需要 node_modules
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
npmRebuild: false
asar: true

extraResources:
  # 内置 UI 包：运行时从 resources/ui/<id>/ 读取（见 src/main/ui/providers.ts）
  - from: ../../packages/ui-web/dist
    to: ui/web
  - from: resources
    to: .
    filter:
      - icon.png
      - tray.png
      - tray@2x.png
  # 命令行 cloudssh 与 Claude Code skill（实例管理里一键安装，用客户端自己当 Node 运行，见 src/main/platform/cli-install.ts）；
  # cloudssh-shim.exe 是 Windows 上的命令启动器（packages/cli/shim），缺了它命令只能退回 .cmd
  - from: ../../packages/cli/dist
    to: cli
    filter:
      - cloudssh.mjs
      - cloudssh-shim.exe
  # 许可与上游署名（内置 UI 来自 CloudSSH，Apache-2.0）
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE
    to: NOTICE.txt

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CloudSSH
  # 文件名里的版本号也用来认缓存里的安装包装没装过（src/main/platform/update-cache.ts），改格式时一起改
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  # 卸载时删掉自动更新的缓存目录（自动更新、覆盖安装时不删）
  include: resources/installer.nsh

# 自动更新的发布源（见 src/main/platform/updater.ts）：公开仓库的 GitHub Releases。
# 打包时据此生成 resources/app-update.yml；pnpm dist:win 只打包（--publish never），
# pnpm release:win 打包并上传安装包、blockmap 与 latest.yml 到草稿 Release，全部传完由 scripts/publish-release.mjs
# 核对后再公开（直接建正式 Release 会有文件没传完、客户端找不到 latest.yml 的空档）。需要环境变量 GH_TOKEN
publish:
  provider: github
  owner: XMZO
  repo: CloudSSH-client
  releaseType: draft
